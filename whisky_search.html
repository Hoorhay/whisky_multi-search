<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisky Multi-Search</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥃</text></svg>">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --accent-amber: #f59e0b;
            --accent-amber-hover: #d97706;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-emerald: #10b981;
            --accent-emerald-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 36px 12px 16px;
            font-size: 0.95rem;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--accent-amber);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .bracket-text {
            color: #b28b29; 
        }


	.history-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .history-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .history-dropdown {
            position: absolute;
            top: 105%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        .history-dropdown.show {
            display: block;
        }

        .history-item {
            padding: 10px 14px;
            font-size: 0.875rem;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-clear {
            padding: 8px 14px;
            font-size: 0.75rem;
            color: #ef4444;
            border-top: 1px solid var(--card-border);
            cursor: pointer;
            text-align: right;
            background: rgba(0, 0, 0, 0.2);
        }

        .history-clear:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        button {
            padding: 12px 18px;
            font-size: 0.9rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(110%);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-search {
            background: var(--accent-amber);
            color: #000;
            font-weight: 700;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1.25rem;
        }

        .btn-action {
            flex: 1;
            padding: 10px 12px;
            font-size: 0.85rem;
        }

        .btn-new {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-new:hover { background: rgba(59, 130, 246, 0.25); }

        .btn-sale {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .btn-sale:hover { background: rgba(16, 185, 129, 0.25); }

        .divider {
            margin: 1.25rem 0;
            border-top: 1px solid var(--card-border);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .controls-actions span {
            color: var(--accent-blue);
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
        }

        .controls-actions span:hover {
            color: #93c5fd;
        }

        .site-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 700px;
            overflow-y: auto;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .site-list::-webkit-scrollbar {
            width: 6px;
        }
        .site-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .site-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .site-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .site-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.875rem;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
            user-select: none;
        }

        .site-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .site-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .site-item input[type="checkbox"]:checked {
            background-color: var(--accent-amber);
            border-color: var(--accent-amber);
        }

        .site-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            top: -1px;
            left: 3px;
        }

        .warning {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.4;
        }

        .footer {
            margin-top: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s ease;
        }

        .github-link:hover {
            color: var(--text-main);
        }

        .github-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Whisky Multi-Search</h2>

    <form id="searchForm">
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="query" placeholder="e.g. Uigeadail" autofocus autocomplete="off">
                <button type="button" class="history-btn" id="historyToggle">▼</button>
                <div class="history-dropdown" id="historyDropdown">
                    <div id="historyItems"></div>
                    <div class="history-clear" id="clearHistory">Clear History</div>
                </div>
            </div>
            <button type="submit" class="btn-search">Search</button>
        </div>
    </form>

    <div class="button-row">
        <button type="button" id="btnNewArrivals" class="btn-action btn-new">New Arrivals</button>
        <button type="button" id="btnSales" class="btn-action btn-sale">Sales & Deals</button>
    </div>

    <div class="divider"></div>

    <div class="controls">
        <strong style="color: var(--text-main);">Select Stores</strong>
        <div class="controls-actions">
            <span id="selectAll">Select All</span> &bull; <span id="selectNone">Clear</span>
        </div>
    </div>

    <div class="site-list" id="siteList"></div>

    <div class="warning">
        ⚠️  Make sure pop-ups are allowed for multiple tabs!
    </div>

    <div class="footer">
        <a href="https://github.com/Hoorhay/whisky_script" target="_blank" rel="noopener noreferrer" class="github-link">
            <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
            </svg>
            GitHub Repository
        </a>
    </div>
</div>

<script>
    const STORES = [
        { id: "deinwhisky", name: "DeinWhisky.de", search: "https://www.deinwhisky.de/search?sSearch=", newUrl: "https://www.deinwhisky.de/neues/", saleUrl: "https://www.deinwhisky.de/angebote/" },
        { id: "whiskysite", name: "WhiskySite.nl", search: "https://www.whiskysite.nl/en/search/{q}/", newUrl: "https://www.whiskysite.nl/en/collection/?sort=newest", saleUrl: "https://www.whiskysite.nl/en/offers/" },
        { id: "passion", name: "Passion For Whisky", search: "https://www.passionforwhisky.com/en/search?controller=search&s=", newUrl: "https://www.passionforwhisky.com/en/new-products/new-arrivals-whisky/", saleUrl: "https://www.passionforwhisky.com/en/sale/whisky-sales/" },
        { id: "whiskybase", name: "Whiskybase Shop [no sales page]", search: "https://shop.whiskybase.com/us/search/{q}/", newUrl: "https://shop.whiskybase.com/us/new/", saleUrl: "https://shop.whiskybase.com/us/" },
        { id: "dramtime", name: "Dramtime", search: "https://www.dramtime.eu/?s={q}&post_type=product&dgwt_wcas=1&lang=en", newUrl: "https://www.dramtime.eu/shop/?orderby=date", saleUrl: "https://www.dramtime.eu/shop/?on_sale=uitverkoop" },
        { id: "delia", name: "Delia Whisky", search: "https://deliawhisky.de/en/search?q={q}&options%5Bprefix%5D=last", newUrl: "https://deliawhisky.de/en-en/collections/neuheiten-whisky", saleUrl: "https://deliawhisky.de/en-en/collections/angebote" },
        { id: "maniac", name: "Whisky Maniac", search: "https://www.whisky-maniac.de/search?q=", newUrl: "https://www.whisky-maniac.de/c/new-in", saleUrl: "https://www.whisky-maniac.de" },
        { id: "whic", name: "Whic.de [no sales page]", search: "https://whic.de/search?q=", newUrl: "https://whic.de/neu", saleUrl: "https://whic.de" },
        { id: "oldpipe", name: "The Old Pipe", search: "https://www.theoldpipe.com/en/search/{q}/", newUrl: "https://www.theoldpipe.com/en/collection/?sort=newest", saleUrl: "https://www.theoldpipe.com/en/special-offers/" },
        { id: "vanzuylen", name: "Whisky van Zuylen [only landing page]", search: "https://www.whiskyvanzuylen.nl/zoeken?type=&q=", newUrl: "https://www.whiskyvanzuylen.nl", saleUrl: "https://www.whiskyvanzuylen.nl" },
        { id: "drankdozijn", name: "Drankdozijn",  search: "https://drankdozijn.de/zoeken?zoekterm=", newUrl: "https://drankdozijn.de/nieuw/whisky?orderBy=new-date", saleUrl: "https://drankdozijn.de/aanbiedingen/whisky" },
        { id: "svetnapojov", name: "Svet Nápojov", search: "https://www.svetnapojov.sk/vyhladavanie?search=", newUrl: "https://www.svetnapojov.sk/whisky-c21?f=types%5B%5D%3Dnew", saleUrl: "https://www.svetnapojov.sk/whisky-c21?f=types%5B%5D%3Daction" },
    ];

    // Load saved store preferences
    const savedPrefs = JSON.parse(localStorage.getItem('whisky_store_prefs')) || {};

    const container = document.getElementById('siteList');
    STORES.forEach(store => {
    const isChecked = savedPrefs[store.id] !== undefined ? savedPrefs[store.id] : true;

    // Wraps any content inside [...] with a styled span
    const formattedName = store.name.replace(/(\[.*?\])/g, '<span class="bracket-text">$1</span>');

    const label = document.createElement('label');
    label.className = 'site-item';
    label.innerHTML = `
        <input type="checkbox" data-id="${store.id}" ${isChecked ? 'checked' : ''}>
        <span>${formattedName}</span>
    `;
    container.appendChild(label);
});

    container.addEventListener('change', () => {
        const prefs = {};
        document.querySelectorAll('#siteList input').forEach(cb => {
            prefs[cb.dataset.id] = cb.checked;
        });
        localStorage.setItem('whisky_store_prefs', JSON.stringify(prefs));
    });

    document.getElementById('selectAll').onclick = () => setAllCheckboxes(true);
    document.getElementById('selectNone').onclick = () => setAllCheckboxes(false);

    function setAllCheckboxes(state) {
        document.querySelectorAll('#siteList input').forEach(cb => cb.checked = state);
        container.dispatchEvent(new Event('change'));
    }

    function getSelectedStores() {
        const checkedIds = Array.from(document.querySelectorAll('#siteList input:checked')).map(cb => cb.dataset.id);
        return STORES.filter(s => checkedIds.includes(s.id));
    }

    function openUrls(urls) {
        urls.forEach(url => {
            window.open(url, '_blank');
        });
    }

    // --- Search History Logic ---
    const historyToggle = document.getElementById('historyToggle');
    const historyDropdown = document.getElementById('historyDropdown');
    const historyItemsContainer = document.getElementById('historyItems');
    const queryInput = document.getElementById('query');

    function getHistory() {
        return JSON.parse(localStorage.getItem('whisky_search_history')) || [];
    }

    function saveSearch(term) {
        if (!term) return;
        let history = getHistory().filter(item => item.toLowerCase() !== term.toLowerCase());
        history.unshift(term);
        if (history.length > 5) history = history.slice(0, 5);
        localStorage.setItem('whisky_search_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = getHistory();
        historyItemsContainer.innerHTML = '';
        if (history.length === 0) {
            historyItemsContainer.innerHTML = '<div class="history-item" style="color:var(--text-muted); cursor:default;">No recent searches</div>';
            return;
        }
        history.forEach(term => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.textContent = term;
            div.onclick = () => {
                queryInput.value = term;
                historyDropdown.classList.remove('show');
                queryInput.focus();
            };
            historyItemsContainer.appendChild(div);
        });
    }

    historyToggle.onclick = (e) => {
        e.stopPropagation();
        historyDropdown.classList.toggle('show');
        renderHistory();
    };

    document.getElementById('clearHistory').onclick = (e) => {
        e.stopPropagation();
        localStorage.removeItem('whisky_search_history');
        renderHistory();
    };

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-wrapper')) {
            historyDropdown.classList.remove('show');
        }
    });

    // Search submit handler
    document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const raw = queryInput.value.trim();
        if (!raw) return;

        saveSearch(raw);

        const query = encodeURIComponent(raw);
        const selected = getSelectedStores();

        const urls = selected.map(s => {
            return s.search.includes('{q}') ? s.search.replace('{q}', query) : s.search + query;
        });

        openUrls(urls);
    });

    document.getElementById('btnNewArrivals').addEventListener('click', () => {
        const selected = getSelectedStores();
        const urls = selected.map(s => s.newUrl);
        openUrls(urls);
    });

    document.getElementById('btnSales').addEventListener('click', () => {
        const selected = getSelectedStores();
        const urls = selected.map(s => s.saleUrl);
        openUrls(urls);
    });
</script>

</body>
</html>
