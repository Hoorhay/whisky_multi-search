<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisky Multi-Search</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥃</text></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Custom Scrollbar for Site List */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-amber-500/30 selection:text-amber-200 antialiased pb-20 flex items-center justify-center">

  <!-- Subtle gradient background blur behind top content -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-amber-600/5 blur-[120px] pointer-events-none -z-10"></div>

  <div class="w-full max-w-lg mx-auto px-4 sm:px-6 pt-6 sm:pt-10">

    <!-- Card Container -->
    <div class="bg-zinc-900/50 rounded-2xl shadow-xl border border-zinc-800 p-6 sm:p-8 backdrop-blur-md">

      <!-- Header -->
      <header class="mb-4 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 tracking-tight">
          Whisky Multi-Search
        </h1>
      </header>

      <!-- Search Form -->
      <form id="searchForm" class="mb-4">
        <div class="flex gap-2.5">
          <div class="relative flex-1 flex items-center">
            <input
              type="text"
              id="query"
              placeholder="e.g. Uigeadail"
              autofocus
              autocomplete="off"
              class="w-full bg-zinc-950/80 border border-zinc-800 text-white rounded-xl pl-4 pr-9 py-2 text-sm sm:text-base focus:outline-none focus:border-amber-500/60 focus:ring-4 focus:ring-amber-500/10 transition-all placeholder:text-zinc-500"
            />
            <button
              type="button"
              id="historyToggle"
              class="absolute right-2 text-zinc-400 hover:text-white hover:bg-zinc-800 p-1 rounded-lg transition-colors cursor-pointer text-xs"
              aria-label="Search History"
            >
              ▼
            </button>

            <!-- History Dropdown -->
            <div id="historyDropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 overflow-hidden">
              <div id="historyItems" class="divide-y divide-zinc-800/50"></div>
              <div id="clearHistory" class="p-2.5 text-xs text-red-400 hover:bg-red-500/10 border-t border-zinc-800 cursor-pointer text-right transition font-medium">
                Clear History
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="bg-amber-500 hover:bg-amber-400 text-zinc-950 px-5 py-3 rounded-xl font-bold text-sm transition-all active:scale-95 cursor-pointer shadow-lg shadow-amber-500/10 flex items-center justify-center shrink-0"
          >
            Search
          </button>
        </div>
      </form>

      <!-- Quick Action Buttons -->
      <div class="grid grid-cols-2 gap-2.5 mb-4">
        <button
          type="button"
          id="btnNewArrivals"
          class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/20 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-95 cursor-pointer shadow-sm"
        >
          New Arrivals
        </button>
        <button
          type="button"
          id="btnSales"
          class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-95 cursor-pointer shadow-sm"
        >
          Sales & Deals
        </button>
      </div>

      <div class="border-t border-zinc-800/80 my-4"></div>

      <!-- Controls -->
      <div class="flex items-center justify-between mb-3 px-1 text-xs">
        <span class="font-bold uppercase tracking-wider text-zinc-400">Select Stores</span>
        <div class="flex gap-2 font-medium">
          <button type="button" id="selectAll" class="text-amber-400 hover:text-amber-300 transition cursor-pointer">Select All</button>
          <span class="text-zinc-600">•</span>
          <button type="button" id="selectNone" class="text-zinc-400 hover:text-zinc-300 transition cursor-pointer">Clear</button>
        </div>
      </div>

      <!-- Store List -->
      <div id="siteList" class="max-h-150 overflow-y-auto bg-zinc-950/60 p-2 rounded-xl border border-zinc-800/80 custom-scrollbar"></div>

      <!-- Warning -->
      <div class="mt-4 p-2 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs text-center font-medium leading-relaxed">
        ⚠️ Make sure pop-ups are allowed for multiple tabs!
      </div>

      <!-- Footer -->
      <div class="mt-4 flex justify-center">
        <a
          href="https://github.com/Hoorhay/whisky_multi-search"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-xs text-zinc-500 hover:text-zinc-300 transition-colors"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
          </svg>
          GitHub Repository
        </a>
      </div>

    </div>
  </div>

  <script>
    const STORES = [
      { id: "deinwhisky", name: "DeinWhisky.de", search: "https://www.deinwhisky.de/search?sSearch=", newUrl: "https://www.deinwhisky.de/neues/", saleUrl: "https://www.deinwhisky.de/angebote/" },
      { id: "whiskysite", name: "WhiskySite.nl", search: "https://www.whiskysite.nl/en/search/{q}/", newUrl: "https://www.whiskysite.nl/en/collection/?sort=newest", saleUrl: "https://www.whiskysite.nl/en/offers/" },
      { id: "passion", name: "Passion For Whisky", search: "https://www.passionforwhisky.com/en/search?controller=search&s=", newUrl: "https://www.passionforwhisky.com/en/new-products/new-arrivals-whisky/", saleUrl: "https://www.passionforwhisky.com/en/sale/whisky-sales/" },
      { id: "whiskybase", name: "Whiskybase Shop [no sales page]", search: "https://shop.whiskybase.com/us/search/{q}/", newUrl: "https://shop.whiskybase.com/us/new/", saleUrl: "https://shop.whiskybase.com/us/" },
      { id: "delia", name: "Delia Whisky", search: "https://deliawhisky.de/en/search?q={q}&options%5Bprefix%5D=last", newUrl: "https://deliawhisky.de/en-en/collections/neuheiten-whisky", saleUrl: "https://deliawhisky.de/en-en/collections/angebote" },
      { id: "dramtime", name: "Dramtime", search: "https://www.dramtime.eu/?s={q}&post_type=product&dgwt_wcas=1&lang=en", newUrl: "https://www.dramtime.eu/shop/?orderby=date", saleUrl: "https://www.dramtime.eu/shop/?on_sale=uitverkoop" },
      { id: "maniac", name: "Whisky Maniac", search: "https://www.whisky-maniac.de/search?q=", newUrl: "https://www.whisky-maniac.de/c/new-in", saleUrl: "https://www.whisky-maniac.de" },
      { id: "whic", name: "Whic.de [no sales page]", search: "https://whic.de/#search?query=", newUrl: "https://whic.de/neu", saleUrl: "https://whic.de" },
      { id: "oldpipe", name: "The Old Pipe", search: "https://www.theoldpipe.com/en/search/{q}/", newUrl: "https://www.theoldpipe.com/en/collection/?sort=newest", saleUrl: "https://www.theoldpipe.com/en/special-offers/" },
      { id: "vanzuylen", name: "Whisky van Zuylen [only landing page]", search: "https://www.whiskyvanzuylen.nl/zoeken?type=&q=", newUrl: "https://www.whiskyvanzuylen.nl", saleUrl: "https://www.whiskyvanzuylen.nl" },
      { id: "drankdozijn", name: "Drankdozijn",  search: "https://drankdozijn.de/zoeken?zoekterm=", newUrl: "https://drankdozijn.de/nieuw/whisky?orderBy=new-date", saleUrl: "https://drankdozijn.de/aanbiedingen/whisky" },
      { id: "svetnapojov", name: "Svet Nápojov", search: "https://www.svetnapojov.sk/vyhladavanie?search=", newUrl: "https://www.svetnapojov.sk/whisky-c21?f=types%5B%5D%3Dnew", saleUrl: "https://www.svetnapojov.sk/whisky-c21?f=types%5B%5D%3Daction" },
    ];

    const container = document.getElementById('siteList');

    // Load saved store preferences and custom order
    const savedPrefs = JSON.parse(localStorage.getItem('whisky_store_prefs')) || {};
    const savedOrder = JSON.parse(localStorage.getItem('whisky_store_order')) || [];

    // Sort STORES according to saved order
    let sortedStores = [...STORES];
    if (savedOrder.length > 0) {
      sortedStores.sort((a, b) => {
        const indexA = savedOrder.indexOf(a.id);
        const indexB = savedOrder.indexOf(b.id);
        if (indexA === -1) return 1;
        if (indexB === -1) return -1;
        return indexA - indexB;
      });
    }

    // Render store list
    sortedStores.forEach(store => {
      const isChecked = savedPrefs[store.id] !== undefined ? savedPrefs[store.id] : true;
      const formattedName = store.name.replace(/(\[.*?\])/g, '<span class="text-amber-500/80 text-xs font-normal">$1</span>');

      const div = document.createElement('div');
      div.className = 'site-item flex items-center gap-3 text-sm p-2 rounded-lg cursor-grab hover:bg-zinc-800/40 transition-colors select-none text-zinc-300';
      div.setAttribute('draggable', 'true');
      div.setAttribute('data-id', store.id);

      div.innerHTML = `
        <span class="drag-handle text-zinc-600 text-xs select-none">⁝⁝</span>
        <input type="checkbox" id="cb_${store.id}" data-id="${store.id}" ${isChecked ? 'checked' : ''} class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-amber-500 focus:ring-amber-500/20 focus:ring-offset-0 cursor-pointer accent-amber-500">
        <label for="cb_${store.id}" class="cursor-pointer flex-1 font-medium text-xs sm:text-sm">${formattedName}</label>
      `;
      container.appendChild(div);
    });

    // Save active checkbox preferences and current store order
    function saveState() {
      const prefs = {};
      const order = [];
      document.querySelectorAll('#siteList .site-item').forEach(item => {
        const cb = item.querySelector('input[type="checkbox"]');
        prefs[cb.dataset.id] = cb.checked;
        order.push(cb.dataset.id);
      });
      localStorage.setItem('whisky_store_prefs', JSON.stringify(prefs));
      localStorage.setItem('whisky_store_order', JSON.stringify(order));
    }

    container.addEventListener('change', saveState);

    // Drag and Drop Logic
    let draggedItem = null;

    container.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.site-item');
      if (!item) return;
      draggedItem = item;
      item.classList.add('opacity-40', 'bg-zinc-800');
      e.dataTransfer.effectAllowed = 'move';
    });

    container.addEventListener('dragend', (e) => {
      const item = e.target.closest('.site-item');
      if (item) item.classList.remove('opacity-40', 'bg-zinc-800');
      draggedItem = null;
      saveState();
    });

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const afterElement = getDragAfterElement(container, e.clientY);
      if (draggedItem) {
        if (afterElement == null) {
          container.appendChild(draggedItem);
        } else {
          container.insertBefore(draggedItem, afterElement);
        }
      }
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.site-item:not(.opacity-40)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    document.getElementById('selectAll').onclick = () => setAllCheckboxes(true);
    document.getElementById('selectNone').onclick = () => setAllCheckboxes(false);

    function setAllCheckboxes(state) {
      document.querySelectorAll('#siteList input').forEach(cb => cb.checked = state);
      saveState();
    }

    function getSelectedStores() {
      const checkedItems = Array.from(document.querySelectorAll('#siteList .site-item')).filter(item => {
        return item.querySelector('input[type="checkbox"]').checked;
      });
      const checkedIds = checkedItems.map(item => item.getAttribute('data-id'));
      return checkedIds.map(id => STORES.find(s => s.id === id)).filter(Boolean);
    }

    function openUrls(urls) {
      urls.forEach(url => {
        window.open(url, '_blank');
      });
    }

    // Search History Logic
    const historyToggle = document.getElementById('historyToggle');
    const historyDropdown = document.getElementById('historyDropdown');
    const historyItemsContainer = document.getElementById('historyItems');
    const queryInput = document.getElementById('query');

    function getHistory() {
      return JSON.parse(localStorage.getItem('whisky_search_history')) || [];
    }

    function saveSearch(term) {
      if (!term) return;
      let history = getHistory().filter(item => item.toLowerCase() !== term.toLowerCase());
      history.unshift(term);
      if (history.length > 5) history = history.slice(0, 5);
      localStorage.setItem('whisky_search_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      historyItemsContainer.innerHTML = '';
      if (history.length === 0) {
        historyItemsContainer.innerHTML = '<div class="p-3 text-xs text-zinc-500 text-center select-none">No recent searches</div>';
        return;
      }
      history.forEach(term => {
        const div = document.createElement('div');
        div.className = 'p-2.5 text-xs text-zinc-300 hover:bg-zinc-800/60 cursor-pointer transition flex justify-between items-center';
        div.textContent = term;
        div.onclick = () => {
          queryInput.value = term;
          historyDropdown.classList.add('hidden');
          queryInput.focus();
        };
        historyItemsContainer.appendChild(div);
      });
    }

    historyToggle.onclick = (e) => {
      e.stopPropagation();
      historyDropdown.classList.toggle('hidden');
      renderHistory();
    };

    document.getElementById('clearHistory').onclick = (e) => {
      e.stopPropagation();
      localStorage.removeItem('whisky_search_history');
      renderHistory();
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchForm')) {
        historyDropdown.classList.add('hidden');
      }
    });

    // Search Submit Handler
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = queryInput.value.trim();
      if (!raw) return;

      saveSearch(raw);

      const query = encodeURIComponent(raw);
      const selected = getSelectedStores();

      const urls = selected.map(s => {
        return s.search.includes('{q}') ? s.search.replace('{q}', query) : s.search + query;
      });

      openUrls(urls);
    });

    document.getElementById('btnNewArrivals').addEventListener('click', () => {
      const selected = getSelectedStores();
      const urls = selected.map(s => s.newUrl);
      openUrls(urls);
    });

    document.getElementById('btnSales').addEventListener('click', () => {
      const selected = getSelectedStores();
      const urls = selected.map(s => s.saleUrl);
      openUrls(urls);
    });
  </script>

</body>
</html>
